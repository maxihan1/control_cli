# Godot 표준 화면(sample-godot)에 SDK 를 넣어(instrument) xvfb 위에서 띄우고 conform 을 돌린다 · 이 맥 실측용 macOS 앱 · 웹을 굽는다 — Godot 는 라이선스 없이 받는다
name: godot

on:
  pull_request:
    paths: ['sdk/godot/**', 'sample-godot/**', 'src/**', 'protocol/**', 'package.json', '.github/workflows/godot.yml']
  push:
    branches: [main]
    paths: ['sdk/godot/**', 'sample-godot/**', 'src/**', 'protocol/**', 'package.json', '.github/workflows/godot.yml']
  workflow_dispatch:

jobs:
  conform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 바닥(Logger 가 생긴 4.5)과 최신 판.
        godot: ['4.5.2', '4.7.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
      - uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-editor-${{ matrix.godot }}
      - name: Godot 받기
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSfL -o g.zip "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${{ matrix.godot }}-stable_linux.x86_64" godot && rm g.zip
          fi
      - run: node dist/main.js instrument sample-godot
      # 스크립트 class_name 표(.godot)를 만들고 GDScript 를 한 번 읽는다 — 문법 오류는 여기서 보인다.
      - run: ~/godot/godot --headless --path sample-godot --import 2>&1 | tee import.log
      - name: conform
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x1024x24' ~/godot/godot --path sample-godot --rendering-driver opengl3 --audio-driver Dummy > godot.log 2>&1 &
          node dist/main.js open --pc
          node dist/main.js conform | tee conform.txt
      - if: always()
        run: cat godot.log || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-conform-${{ matrix.godot }}
          path: |
            conform.txt
            godot.log
            import.log
          retention-days: 14

  # 이 맥에서 open --pc --app · 웹(relay)으로 실측할 결과물 — 최신 판으로 굽는다.
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: 4.7.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT }}-android
      # 판 묶음(tpz)은 1GB 를 넘는다 — macOS · 웹(스레드 없음) · Android(미리 지은 APK) 템플릿만 풀어 둔다.
      - name: Godot · export 템플릿 받기
        run: |
          T=~/.local/share/godot/export_templates/${GODOT}.stable
          if [ ! -x ~/godot/godot ] || [ ! -f "$T/android_debug.apk" ]; then
            mkdir -p ~/godot "$T" && cd ~/godot
            curl -sSfL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
            unzip -q -o g.zip && mv "Godot_v${GODOT}-stable_linux.x86_64" godot && rm g.zip
            curl -sSfL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz"
            unzip -q -o t.tpz 'templates/macos.zip' 'templates/web_nothreads_*' 'templates/android_debug.apk' 'templates/version.txt' && mv templates/* "$T/" && rm -r t.tpz templates
          fi
      # Android 디버그 서명 — 잡마다 새 keystore 라 다른 빌드로 바꿀 때 폰에서 먼저 지운다(Unity sample 과 같음).
      - run: keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - run: node dist/main.js instrument sample-godot
      - run: ~/godot/godot --headless --path sample-godot --import
      - run: |
          mkdir -p sample-godot/build/macOS sample-godot/build/web
          ~/godot/godot --headless --path sample-godot --export-release macOS build/macOS/control-cli-sample.zip
          ~/godot/godot --headless --path sample-godot --export-release Web build/web/index.html
          mkdir -p sample-godot/build/android
          ~/godot/godot --headless --path sample-godot --export-debug Android build/android/control-cli-sample.apk
          ls -la sample-godot/build/macOS sample-godot/build/web sample-godot/build/android
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      - uses: actions/upload-artifact@v7
        with:
          name: godot-sample-${{ env.GODOT }}
          path: sample-godot/build
          retention-days: 14
