# 버리는 workflow — C1 실행이 구운 Windows 샘플 빌드를 runner 에서 띄워 창 · conform · pad xbox 를 잰다(병합 전에 지운다)
name: win-try

on:
  push:
    branches: [worktree-c2-windows-cli]

permissions:
  actions: read
  contents: read

jobs:
  try:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: gh run download 44056206295 -n sample-6000.0.84f1-StandaloneWindows64-input1 -D build
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 화면 크기
        shell: pwsh
        run: |
          Get-DisplayResolution
          foreach ($r in @(@(2560, 1600), @(1920, 1440), @(1920, 1200), @(1920, 1080))) {
            try { Set-DisplayResolution -Width $r[0] -Height $r[1] -Force } catch { "거절 $($r[0])x$($r[1]) — $_" }
            $now = (Get-DisplayResolution | Out-String).Trim()
            "요청 $($r[0])x$($r[1]) → 지금 $now"
            if ($now -match "$($r[0])x$($r[1])") { break }
          }
          exit 0
      - name: open --pc --app → conform → pad xbox
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build -Filter *.exe | Where-Object Name -notlike 'UnityCrash*' | Select-Object -First 1).FullName
          node dist/main.js open --pc --app "$exe"
          "open exit $LASTEXITCODE"
          Get-Process | Where-Object Name -like 'control-cli*' | Format-List Name, Id, MainWindowHandle, MainWindowTitle, Responding
          Get-ChildItem .control-cli -Filter *.yml | Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -TotalCount 1 -Encoding utf8 }
          node dist/main.js pad xbox
          node dist/main.js pad off
          node dist/main.js conform
          "conform exit $LASTEXITCODE"
          node dist/main.js close
          exit 0
      - name: 기록 모으기
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (Test-Path .control-cli) { Copy-Item .control-cli out/session -Recurse }
          Get-ChildItem "$env:USERPROFILE\AppData\LocalLow" -Recurse -Filter Player*.log -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName out }
          Get-ChildItem out -Recurse | Select-Object FullName, Length
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: win-try
          path: out
          retention-days: 3
