# 버리는 workflow — sample.yml 에 넣을 conform-windows 잡을 꼴 그대로 돌려 본다(병합 전에 지운다)
name: win-try

on:
  push:
    branches: [worktree-c2-windows-cli]

jobs:
  # sample.yml 의 build 잡 흉내 — C1 실행이 구운 Windows 빌드를 이 실행의 결과물로 다시 올린다.
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - run: gh run download 44056206295 -R ${{ github.repository }} -n sample-6000.0.84f1-StandaloneWindows64-input1 -D build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: sample-6000.0.84f1-StandaloneWindows64-input1
          path: build
          retention-days: 1

  conform-windows:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: gh run download ${{ github.run_id }} -n sample-6000.0.84f1-StandaloneWindows64-input1 -D build
        env:
          GH_TOKEN: ${{ github.token }}
      # runner 화면은 1024×768 이다 — 샘플 창(540×1200)이 그만큼 잘리면 UI Toolkit 패널이 uGUI 칸을 덮어 find-at · swipe · scroll 줄이 실패한다. 1920×1080 이 이 runner 가 받는 가장 큰 값이다.
      - run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: open --pc --app → pad xbox → conform
        run: |
          node dist/main.js open --pc --app build\control-cli-sample.exe
          $pad = node dist/main.js pad xbox
          $pad
          node dist/main.js pad off
          node dist/main.js conform
          $code = $LASTEXITCODE
          node dist/main.js close
          if (-not ($pad -match 'XInputControllerWindows')) { Write-Error 'pad xbox 가 XInputControllerWindows 가 아닙니다' }
          exit $code
      - name: 실패하면 게임 기록 끝
        if: failure()
        run: Get-ChildItem "$env:USERPROFILE\AppData\LocalLow" -Recurse -Filter Player.log | ForEach-Object { Get-Content $_.FullName -Tail 80 }
