# tag 를 올리면 CLI 를 npm tarball 로 묶어 GitHub Release 에 올린다 — 개발사가 `npx -y <주소> instrument <폴더>` 한 줄로 받는다(docs/sdk-integration.md)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # instrument 는 SDK 를 v<package.json 판> tag 로 고정한다 — tag 와 판이 다르면 없는 tag 를 가리키는 tarball 이 나간다.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # 주소에 판이 한 번만 들게 이름을 고정한다 — releases/download/<tag>/control-cli.tgz
      - run: npm pack && mv control-cli-*.tgz control-cli.tgz
      - run: gh release create "$GITHUB_REF_NAME" control-cli.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
